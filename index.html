<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Reward Edition</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --food: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }

    .header {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--text);
    }

    .reward-bar {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .reward-amount {
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    canvas {
      background: #020617;
      border: 2px solid var(--border);
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: #283548;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: #16a34a;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">High Score</div>
      <div class="stat-value" id="highScore">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Rate / Pt</div>
      <div class="stat-value" style="font-size: 13px; line-height: 24px;">0.00000001 ₹</div>
    </div>
  </div>

  <div class="reward-bar">
    <span>Earned Reward (Simulated):</span>
    <span class="reward-amount" id="reward">0.00000000 ₹</span>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button class="primary" id="restartBtn">Restart</button>
  </div>

  <div class="hint">
    Move: Arrow Keys / WASD &nbsp;|&nbsp; Pause: Space or P
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const rewardEl = document.getElementById("reward");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    const rewardPerPoint = 0.00000001; // 1e-8 Rs per point

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
    let isPaused = false;
    let isGameOver = false;
    let lastFrameTime = 0;
    const moveIntervalMs = 115;

    highScoreEl.textContent = highScore;

    function formatReward(points) {
      // Exact decimal formatting for 1e-8 Rs per point
      const microUnits = BigInt(points);
      const whole = microUnits / 100000000n;
      const fraction = (microUnits % 100000000n).toString().padStart(8, "0");
      return `${whole}.${fraction} ₹`;
    }

    function updateHUD() {
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      rewardEl.textContent = formatReward(score);
    }

    function spawnFood() {
      while (true) {
        const candidate = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        const onSnake = snake.some(seg => seg.x === candidate.x && seg.y === candidate.y);
        if (!onSnake) {
          food = candidate;
          return;
        }
      }
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      isPaused = false;
      isGameOver = false;
      pauseBtn.textContent = "Pause";
      spawnFood();
      updateHUD();
      draw();
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? "Resume" : "Pause";
      if (!isPaused) {
        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
      } else {
        draw();
      }
    }

    function step() {
      direction = nextDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        isGameOver = true;
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        isGameOver = true;
        return;
      }

      snake.unshift(head);

      // Food check
      if (head.x === food.x && head.y === food.y) {
        score += 1;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem("snakeHighScore", String(highScore));
        }
        updateHUD();
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = "rgba(148, 163, 184, 0.06)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Snake
      snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(
          seg.x * gridSize + 1,
          seg.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });

      // Overlay for Pause or Game Over
      if (isPaused || isGameOver) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 26px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
          isGameOver ? "Game Over" : "Paused",
          canvas.width / 2,
          canvas.height / 2 - 12
        );

        ctx.fillStyle = "#22c55e";
        ctx.font = "600 14px system-ui, sans-serif";
        ctx.fillText(
          `Earned: ${formatReward(score)}`,
          canvas.width / 2,
          canvas.height / 2 + 16
        );

        if (isGameOver) {
          ctx.fillStyle = "#94a3b8";
          ctx.font = "13px system-ui, sans-serif";
          ctx.fillText(
            "Click Restart to play again",
            canvas.width / 2,
            canvas.height / 2 + 40
          );
        }
      }
    }

    function gameLoop(timestamp) {
      if (isPaused || isGameOver) {
        draw();
        return;
      }

      if (timestamp - lastFrameTime >= moveIntervalMs) {
        lastFrameTime = timestamp;
        step();
        draw();
      }

      if (!isGameOver) {
        requestAnimationFrame(gameLoop);
      } else {
        draw();
      }
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if (key === " " || key === "p") {
        e.preventDefault();
        togglePause();
        return;
      }

      if ((key === "arrowup" || key === "w") && direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      } else if ((key === "arrowdown" || key === "s") && direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      } else if ((key === "arrowleft" || key === "a") && direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      } else if ((key === "arrowright" || key === "d") && direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    });

    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", () => {
      resetGame();
      lastFrameTime = performance.now();
      requestAnimationFrame(gameLoop);
    });

    resetGame();
    lastFrameTime = performance.now();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
